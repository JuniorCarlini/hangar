services:
  n8n:
    image: n8nio/n8n:2.43.7
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${service_db}
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${db_password}
      # Encrypts the credentials n8n stores; losing it loses them.
      N8N_ENCRYPTION_KEY: ${encryption_key}
      N8N_PORT: "5678"
      N8N_DIAGNOSTICS_ENABLED: "false"
      NODE_ENV: production
    volumes:
      - data:/home/node/.n8n
    expose:
      - "5678"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    # Runs as the image's node user: no capability needed.
    cap_add: []
    depends_on: [db]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  db:
    image: postgres:18
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${db_password}
    volumes:
      - pgdata:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  data:
  pgdata:

services:
  postgres:
    image: postgres:18
    # 25% of the memory limit; adjust together with the limit.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    environment:
      POSTGRES_DB: ${database}
      POSTGRES_USER: ${user}
      POSTGRES_PASSWORD: ${password}
    volumes:
      - data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${user} -d ${database}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    # The entrypoint fixes the data directory owner and drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  data:

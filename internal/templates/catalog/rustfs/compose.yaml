services:
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${access_key}
      RUSTFS_SECRET_KEY: ${secret_key}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - data:/data
    # The web console; apps use the S3 API on port 9000 inside the network.
    expose:
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    # Runs as the image's rustfs user: no capability needed.
    cap_add: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  data:

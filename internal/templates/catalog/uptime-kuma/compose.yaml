services:
  kuma:
    # The rootless variant runs as an unprivileged user from the start.
    image: louislam/uptime-kuma:2-rootless
    environment:
      UPTIME_KUMA_PORT: "3001"
    volumes:
      - data:/app/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    cap_add: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  data:

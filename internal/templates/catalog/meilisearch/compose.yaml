services:
  meilisearch:
    image: getmeili/meilisearch:v1.55
    environment:
      MEILI_MASTER_KEY: ${master_key}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data/data.ms
    volumes:
      - data:/meili_data
    expose:
      - "7700"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    cap_add: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  data:

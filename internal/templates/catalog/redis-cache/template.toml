id = "redis-cache"
version = 1
category = "cache"
tags = ["redis", "key-value", "cache"]
docs = "https://redis.io/docs/latest/"
main = "redis"
name = { en = "Redis (cache)", "pt-BR" = "Redis (cache)" }
description = { en = "Cache with no persistence: evicts the least used keys when full. Generated password; FLUSHALL, CONFIG and DEBUG disabled.", "pt-BR" = "Cache sem persistência: descarta as chaves menos usadas quando enche. Senha gerada; FLUSHALL, CONFIG e DEBUG desligados." }

[variables.password]
generate = "secret"

[[exports]]
key = "REDIS_URL"
value = "redis://:${password}@${service}:6379/0"
secret = true

[[exports]]
key = "HOST"
value = "${service}"

[[exports]]
key = "PORT"
value = "6379"

[[exports]]
key = "PASSWORD"
value = "${password}"
secret = true

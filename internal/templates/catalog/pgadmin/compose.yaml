services:
  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${email}
      PGADMIN_DEFAULT_PASSWORD: ${password}
      # An unprivileged port: binding 80 would need a capability.
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - data:/var/lib/pgadmin
    expose:
      - "5050"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5050/misc/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    # Runs as the image's pgadmin user: no capability needed.
    cap_add: []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  data:

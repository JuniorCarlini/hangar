file_text = """Hangar · Kit de recuperação · CONFIDENCIAL
==========================================================

Nome da chave:          {label}
Gerada em:              {date}
Código de confirmação:  {code}
Chave pública:          {public}

Esta é a chave que abre os backups do seu Hangar. A chave secreta está
na última linha deste arquivo (começa com AGE-SECRET-KEY-1).

COMO USAR
1. Guarde este arquivo FORA do servidor (gerenciador de senhas ou
   pendrive) e a versão em papel em outro lugar.
2. O painel pede a confirmação de tempos em tempos: escolha este
   arquivo ou digite o código de confirmação acima.
3. Para recuperar os backups num servidor novo, o Hangar pede este
   arquivo.

ATENÇÃO
Quem tiver este arquivo abre os seus backups; sem ele, ninguém abre,
nem você. Não envie por mensagem nem por e-mail.

PARA QUEM USA O TERMINAL
Abrir um backup no computador:
  hangar-cofre decrypt arquivo.age -identity hangar-kit.txt
  (ou: age -d -i hangar-kit.txt arquivo.age)
Proteger este arquivo com uma frase-senha:
  hangar-cofre kit protect hangar-kit.txt

CHAVE SECRETA (linha abaixo):"""


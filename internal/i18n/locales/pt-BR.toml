[cofre]
usage = """
Uso: hangar-cofre <comando> [opções]

Comandos:
  init                           cria ~/.config/hangar-cofre/cofre.toml de exemplo
  sync PASTA                     copia os backups novos do bucket para a pasta (nunca apaga)
  list                           lista os backups (do bucket, ou de -from PASTA)
  decrypt ARQUIVO [-o SAÍDA]     decifra um backup com o seu kit
  restore-local PROJETO/SERVIÇO  sobe o banco no Docker local (-at "2026-10-15 14:32", -dump, -port)
  test [PROJETO/SERVIÇO]         o simulado: restaura cada banco num Postgres local e confere
  kit check ARQUIVO              mostra a chave pública e o código do kit
  kit protect ARQUIVO            protege o kit com uma frase-senha
  setup-bucket                   aplica as regras de ciclo de vida (credencial de admin em
                                 HANGAR_COFRE_ADMIN_ACCESS_KEY / HANGAR_COFRE_ADMIN_SECRET_KEY)

Opções comuns:
  -config caminho     cofre.toml (padrão ~/.config/hangar-cofre/cofre.toml)
  -identity caminho   o kit (hangar-kit.txt)
  -from pasta         lê de uma pasta copiada pelo sync, sem internet
"""

[cofre]
usage = """
Usage: hangar-cofre <command> [options]

Commands:
  init                           write an example ~/.config/hangar-cofre/cofre.toml
  sync FOLDER                    copy new backups from the bucket into the folder (never deletes)
  list                           list the backups (in the bucket, or in -from FOLDER)
  decrypt FILE [-o OUT]          decrypt a backup with your kit
  restore-local PROJECT/SERVICE  bring the database up in the local Docker (-at "2026-10-15 14:32", -dump, -port)
  test [PROJECT/SERVICE]         the drill: restore each database into a local Postgres and check it
  kit check FILE                 show the kit's public key and code
  kit protect FILE               protect the kit with a passphrase
  setup-bucket                   apply the lifecycle rules (admin credential in
                                 HANGAR_COFRE_ADMIN_ACCESS_KEY / HANGAR_COFRE_ADMIN_SECRET_KEY)

Common options:
  -config path     cofre.toml (default ~/.config/hangar-cofre/cofre.toml)
  -identity path   the kit (hangar-kit.txt)
  -from folder     read from a folder copied by sync, offline
"""

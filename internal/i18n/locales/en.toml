usage = """
Usage: hangard <command> [options]

Commands:
  serve          run the panel
  user           create users, set up 2FA, unlock accounts
  lockdown       lock and unlock the panel (panic button)
  self-update    find, download and apply new Hangar versions
  system         install the systemd units (used by the installer)
  secrets        replace the master key (rotate-key) with the panel stopped
  audit verify   check the audit log integrity
  restore        bring the panel and the databases back from the backups (new server)
  template       check, pack and sign service templates
  version        print the version

Common options:
  -config path   configuration file (default /etc/hangar/hangar.toml)
"""

[cli.secrets]
usage = """
Usage: hangard secrets rotate-key [-config file] [-out file]

Re-encrypts every secret in the database with a new master key. Run it as the
hangar user with the panel stopped (systemctl stop hangard). The new key goes
to data_dir/master.key.new; then, as root, put it in place of the old one
(step by step in docs/24).
"""
flag_out = "where to write the new key (default: data_dir/master.key.new)"
panel_running = "The panel is running. Stop it first: sudo systemctl stop hangard"
out_exists = "{path} already exists: install or delete that key before creating another."
rotated = """{n} secrets encrypted with the new key, written to {out}.
Now, as root:
  install -m 0400 -o hangar -g hangar {key} {key}.old
  install -m 0400 -o hangar -g hangar {out} {key}
  shred -u {out}
  systemctl start hangard
Keep the old key until a new panel backup is done: older backups hold the old key."""

[cli.user]
usage = """
Usage: hangard user <subcommand> [options]

Subcommands:
  create   create a user and set up 2FA        (-email, -role, -no-2fa)
  totp     set up 2FA again (lost phone)        (-email)
  totp-off turn 2FA off for the account          (-email)
  password reset the password (forgotten)        (-email)
  unlock   unlock a locked account             (-email)
"""
flag_email = "user e-mail"
flag_role = "role: owner, admin, operator or viewer"

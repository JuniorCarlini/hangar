name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Tests
        run: go test -race ./...

      - name: Integration with real Docker
        run: go test -race -tags integration -count=1 ./internal/docker/ ./internal/alerts/

      - name: Vulnerabilities
        run: go tool govulncheck ./...

      - name: sqlc code up to date
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff

      - name: Generated pages (templ) up to date
        run: go tool templ generate && git diff --exit-code -- '*_templ.go'

      - name: Stylesheet (Tailwind) up to date
        run: |
          ./tools/tailwind.sh -i internal/web/tailwind/input.css -o internal/web/assets/app.css --minify
          git diff --exit-code -- internal/web/assets/app.css

      - name: Build for Linux
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/hangard
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/hangard

  # Browser tests (Playwright) against a throwaway panel. Optional: slower
  # than `check` and not required for merging. The runner has Docker, so the
  # container flows run too.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E
        working-directory: e2e
        run: npx playwright test

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

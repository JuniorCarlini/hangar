name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tests
        run: go test -race ./...

      - name: Binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/hangard-linux-$arch ./cmd/hangard
          done
          cp deploy/install.sh dist/install.sh

      - name: Sign
        env:
          VERSION: ${{ github.ref_name }}
          HANGAR_RELEASE_KEY: ${{ secrets.HANGAR_RELEASE_KEY }}
        run: go run ./cmd/hangar-release sign "$VERSION" dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --verify-tag
